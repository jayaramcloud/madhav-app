<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dasaradh's site</title>
<style>
body { font-family: sans-serif; margin: 0; display: flex; min-height: 100vh; }
nav { width: 220px; background: #222; color: #fff; padding: 1rem; }
nav a { color: #fff; display: block; padding: .5rem 0; text-decoration: none; }
main { flex: 1; padding: 2rem; }
nav ul { list-style:none; padding:0; } nav li { position:relative; } nav ul.sub { display:none; position:absolute; left:100%; top:0; background:#333; min-width:140px; } nav li:hover > ul.sub { display:block; } section { display: none; }
section.active { display: block; }
</style>
</head>
<body>
<nav>
  <h2>Menu</h2>
  <ul>
    <li><a href="#" onclick="show('contents')">Site Contents ▼</a>
      <ul class="sub"><li><a href="#" onclick="show('contents')">Overview</a></li></ul>
    </li>
    <li><a href="#" onclick="show('about')">About Us ▼</a></li>
    <li><a href="#" onclick="show('contact')">Contact Us ▼</a></li>
  </ul>
</nav>
<main>
  <header><h1>Hello from Dasaradh!</h1></header>
  <section id="contents" class="active"><h2>Site Contents</h2><p>Classroom site, learning resources.</p></section>
  <section id="about"><h2>About Us</h2><p>This site helps people preparing for jobs with resources and guidance.</p></section>
  <section id="contact"><h2>Contact Us</h2>
  <form action="https://formspree.io/f/dasaradhmandava@gmail.com" method="POST">
    <label>Name: <input name="name" required></label><br>
    <label>Email: <input name="email" type="email" required></label><br>
    <button type="submit">Send</button>
  </form>
  <p>1223, Edmonton</p>
  </section>
</main>
<script>function show(id){document.querySelectorAll("section").forEach(s=>s.classList.remove("active"));document.getElementById(id).classList.add("active");}</script>
</body>
</html>
